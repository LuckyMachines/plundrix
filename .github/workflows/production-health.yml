name: Production health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: read

concurrency:
  group: plundrix-production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production
        run: npm run ops:health
      - name: Preserve health summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plundrix-production-health
          path: reports/ops/production-health-latest.json
          if-no-files-found: warn
          retention-days: 14
